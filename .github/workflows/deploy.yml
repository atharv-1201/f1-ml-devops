name: F1 ML DevOps CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: 1. Automated Testing & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Quality Gate
        run: |
          pytest tests/ -v

  deploy:
    name: 2. Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Automated Deployment on EC2..."
            
            # Setup repository directory on EC2
            if [ ! -d "$HOME/f1-ml-devops" ]; then
              git clone https://github.com/${{ github.repository }}.git $HOME/f1-ml-devops
            fi
            
            cd $HOME/f1-ml-devops
            git fetch --all
            git reset --hard origin/main
            
            echo "🐳 Building Docker Container..."
            docker build -t f1-predictor:latest .
            
            echo "🔄 Restarting Container..."
            docker stop f1-predictor || true
            docker rm f1-predictor || true
            docker run -d --name f1-predictor --restart always -p 8000:8000 f1-predictor:latest
            
            echo "🩺 Verifying Health Check..."
            sleep 6
            curl -f http://localhost:8000/health || (echo "Health check failed" && exit 1)
            
            echo "✅ ML Inference Service successfully running on EC2!"
